name: Python Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Unit Tests
      run: |
        export PYTHONPATH=.
        python3 -m unittest tests/test_parser.py
        python3 -m unittest tests/test_macro.py
        python3 -m unittest tests/test_defmodule.py
        python3 -m unittest tests/test_ir.py

    - name: Run Integration Tests
      run: |
        export PYTHONPATH=.
        python3 -m unittest tests/test_stdlib.py

    - name: Run REPL End-to-End Test
      run: |
        export PYTHONPATH=.
        python3 -m src.frontend.repl < test_repl.in
